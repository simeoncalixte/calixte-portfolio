<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experience gallery preview</title><link rel="stylesheet" href="/src/style.css"><style>body{overflow:auto;background:#142331}#panel.open{position:relative;top:auto;right:auto;margin:30px auto;transform:none;max-height:none;opacity:1;pointer-events:auto;width:min(740px,calc(100% - 32px))}</style></head><body><aside id="panel" class="experience-panel open"><div id="panel-body"></div></aside><script type="module">import {CONTENT} from '/src/ui/content.js';const panel=document.querySelector('#panel-body');const open=id=>{panel.innerHTML=CONTENT[id];window.scrollTo(0,0);};panel.addEventListener('click',e=>{const b=e.target.closest('[data-experience]');if(b)open(b.dataset.experience);});open(new URLSearchParams(location.search).get('chapter')||'projects');</script></body></html>
